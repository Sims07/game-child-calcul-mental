<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcul Mental 🧮</title>
<style>
  :root{
    --bg1:#fff4d6;
    --bg2:#ffd6e8;
    --card:#ffffff;
    --primary:#ff6b6b;
    --primary-dark:#e85555;
    --success:#4caf50;
    --text:#3a3a3a;
    --accent:#4ecdc4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]){
      --bg1:#2b2140;
      --bg2:#3a2a4d;
      --card:#3f3450;
      --text:#f5f0ff;
    }
  }
  :root[data-theme="dark"]{
    --bg1:#2b2140;
    --bg2:#3a2a4d;
    --card:#3f3450;
    --text:#f5f0ff;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
  }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px;
    padding-top:max(20px, env(safe-area-inset-top));
    color:var(--text);
    overflow-x:hidden;
  }
  .card{
    background:var(--card);
    border-radius:28px;
    box-shadow:0 12px 30px rgba(0,0,0,0.15);
    padding:32px 24px;
    width:100%;
    max-width:420px;
    text-align:center;
    position:relative;
    margin-top:4vh;
  }
  @media (max-height: 700px){
    .card{ margin-top:0; padding:20px 20px; }
    .mascot{ font-size:1.8rem; }
    h1{ font-size:1.3rem; margin-bottom:2px; }
    .operation{ font-size:2.1rem; margin:10px 0; }
    .badges-row{ margin-bottom:8px; }
    .score-row{ margin-bottom:8px; }
    .toast-inline{ min-height:1.8rem; margin-bottom:2px; }
    .toast-emoji{ font-size:1.3rem; }
    .toast-title{ font-size:0.85rem; }
    input[type="number"]{ font-size:1.6rem; padding:8px; }
    button{ margin-top:12px; padding:10px 28px; }
  }
  .mode-switch{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:14px;
  }
  .mode-btn{
    flex:1;
    max-width:150px;
    padding:8px 10px;
    border-radius:14px;
    border:2px solid var(--accent);
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:0.95rem;
    font-weight:bold;
    cursor:pointer;
    margin:0;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .mode-btn.active{
    background:var(--accent);
    color:white;
  }
  .mascot-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:2px;
  }
  .mascot{
    font-size:2.4rem;
    display:inline-block;
    transition:transform 0.25s ease;
  }
  .mascot.bounce{
    animation:mascotBounce 0.5s ease;
  }
  @keyframes mascotBounce{
    0%{ transform:scale(1) rotate(0deg); }
    30%{ transform:scale(1.3) rotate(-8deg); }
    60%{ transform:scale(1.15) rotate(6deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  h1{
    font-size:1.6rem;
    margin:0 0 6px;
  }
  .score-row{
    display:flex;
    justify-content:space-between;
    font-size:0.95rem;
    margin-bottom:18px;
    color:var(--text);
    opacity:0.8;
  }
  .operation{
    font-size:2.6rem;
    font-weight:bold;
    margin:20px 0;
    letter-spacing:2px;
  }
  .num-a{ color:var(--accent); }
  .num-b{ color:var(--primary); }
  .op-symbol{ color:var(--text); opacity:0.6; margin:0 4px; }
  .hint-toggle{
    background:transparent;
    border:2px dashed var(--accent);
    color:var(--accent);
    font-family:inherit;
    font-size:0.85rem;
    font-weight:bold;
    padding:6px 16px;
    border-radius:14px;
    cursor:pointer;
    margin:0 0 10px;
  }
  .hint-toggle.active{
    background:var(--accent);
    color:white;
    border-style:solid;
  }
  .cubes-container{
    display:none;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:4px;
    margin:0 0 14px;
    min-height:24px;
  }
  .cubes-container.visible{
    display:flex;
  }
  .cube{
    width:20px;
    height:20px;
    border-radius:5px;
    background:var(--accent);
    flex-shrink:0;
  }
  .cube.b{
    background:var(--primary);
  }
  .cube.removed{
    background:var(--primary);
    border:2px solid var(--primary-dark);
    opacity:0.9;
    position:relative;
  }
  .cube.removed::after{
    content:'×';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    font-size:0.95rem;
  }
  .cubes-op-symbol{
    font-size:1.2rem;
    font-weight:bold;
    margin:0 4px;
  }
  input[type="number"]{
    width:140px;
    font-size:2rem;
    text-align:center;
    padding:10px;
    border-radius:16px;
    border:3px solid var(--accent);
    background:transparent;
    color:var(--text);
    outline:none;
  }
  input[type="number"]:focus{
    border-color:var(--primary);
  }
  button{
    display:block;
    margin:22px auto 0;
    font-size:1.2rem;
    font-weight:bold;
    padding:14px 36px;
    border:none;
    border-radius:20px;
    background:var(--primary);
    color:white;
    cursor:pointer;
    transition:transform 0.1s ease;
  }
  button:active{
    transform:scale(0.95);
  }
  button:hover{
    background:var(--primary-dark);
  }
  .feedback{
    margin-top:20px;
    font-size:1.3rem;
    font-weight:bold;
    min-height:2.2rem;
  }
  .feedback.good{ color:var(--success); }
  .feedback.bad{ color:var(--primary); }
  .confetti{
    position:fixed;
    top:-10px;
    font-size:1.6rem;
    pointer-events:none;
    animation:fall linear forwards;
    z-index:10;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.3; }
  }
  .streak{
    font-size:0.9rem;
    margin-top:8px;
    opacity:0.75;
  }
  .badges-row{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-bottom:16px;
  }
  .badge-item{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .badge-icon{
    font-size:2rem;
    filter:grayscale(1);
    opacity:0.3;
    transition:opacity 0.3s ease, filter 0.3s ease;
  }
  .badge-icon.earned{
    filter:grayscale(0);
    opacity:1;
    animation:badgePop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .badge-time{
    font-size:0.75rem;
    margin-top:4px;
    opacity:0.7;
    min-height:1rem;
  }
  @keyframes badgePop{
    0%{ transform:scale(0.4); }
    60%{ transform:scale(1.25); }
    100%{ transform:scale(1); }
  }
  .toast-inline{
    min-height:2.6rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .toast-inline.visible{
    opacity:1;
  }
  .toast-emoji{ font-size:1.8rem; line-height:1; }
  .toast-title{ font-weight:bold; font-size:1.05rem; color:var(--primary); margin-top:2px; }
  .diploma-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.45);
    z-index:30;
    opacity:0;
    animation:fadeIn 0.3s ease forwards;
    padding:20px;
  }
  @keyframes fadeIn{
    to{ opacity:1; }
  }
  .diploma-card{
    background:linear-gradient(160deg, #fff9e8, #ffffff);
    border:6px double #d4af37;
    border-radius:20px;
    padding:30px 26px;
    text-align:center;
    max-width:360px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    transform:scale(0.8);
    animation:popIn 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
    color:#3a3a3a;
  }
  @keyframes popIn{
    to{ transform:scale(1); }
  }
  .diploma-title{
    font-size:1.4rem;
    font-weight:bold;
    color:#c9971f;
    margin-bottom:4px;
  }
  .diploma-sub{
    font-size:0.95rem;
    opacity:0.75;
    margin-bottom:18px;
  }
  .diploma-medals{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:18px;
  }
  .diploma-medal{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .diploma-medal-icon{
    font-size:2.4rem;
  }
  .diploma-medal-time{
    font-size:0.85rem;
    margin-top:4px;
    font-weight:bold;
  }
  .diploma-medal.missing .diploma-medal-icon{
    filter:grayscale(1);
    opacity:0.3;
  }
  .diploma-total{
    font-size:1rem;
    margin-bottom:20px;
  }
  .diploma-total b{ color:var(--primary); }
  .diploma-btn{
    font-size:1.05rem;
    font-weight:bold;
    padding:12px 30px;
    border:none;
    border-radius:16px;
    background:var(--primary);
    color:white;
    cursor:pointer;
  }
  .diploma-btn:active{ transform:scale(0.96); }
</style>
</head>
<body>
  <div class="card">
    <div class="mascot-row">
      <span class="mascot" id="mascot">🦉</span>
    </div>
    <h1 id="pageTitle">🧮 Calcul Mental</h1>

    <div class="mode-switch">
      <button class="mode-btn active" id="modeAdd">➕ Addition</button>
      <button class="mode-btn" id="modeSub">➖ Soustraction</button>
    </div>

    <div class="score-row">
      <span>✅ Bonnes réponses : <b id="scoreGood">0</b></span>
      <span>🔥 Série : <b id="streak">0</b></span>
    </div>
    <div class="score-row" style="margin-bottom:0;">
      <span>🏆 Niveau : <b id="level">1</b></span>
    </div>

    <div class="badges-row">
      <div class="badge-item">
        <span class="badge-icon" id="badge5" title="5 d'affilée">🥉</span>
        <div class="badge-time" id="badge5-time"></div>
      </div>
      <div class="badge-item">
        <span class="badge-icon" id="badge10" title="10 d'affilée">🥈</span>
        <div class="badge-time" id="badge10-time"></div>
      </div>
      <div class="badge-item">
        <span class="badge-icon" id="badge15" title="15 d'affilée">🥇</span>
        <div class="badge-time" id="badge15-time"></div>
      </div>
    </div>

    <div class="toast-inline" id="toastInline">
      <div class="toast-emoji" id="toastEmoji"></div>
      <div class="toast-title" id="toastTitle"></div>
    </div>

    <div class="operation" id="operation">-- + --</div>

    <button type="button" class="hint-toggle" id="hintToggle">🧊 Je compte avec les cubes</button>
    <div class="cubes-container" id="cubesContainer"></div>

    <input type="number" id="answer" inputmode="numeric" placeholder="?" autofocus>
    <button id="validate">Valider</button>

    <div class="feedback" id="feedback"></div>
  </div>

<script>
  let a, b, correctAnswer;
  let good = 0, streak = 0, best = 0;
  let level = 1;
  let mode = 'add'; // 'add' ou 'sub'
  let showCubes = false;
  let runStartTime = Date.now();
  let badgeTimes = { 5: null, 10: null, 15: null };

  function formatTime(ms){
    const totalSec = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
  }

  const opEl = document.getElementById('operation');
  const answerEl = document.getElementById('answer');
  const feedbackEl = document.getElementById('feedback');
  const scoreGoodEl = document.getElementById('scoreGood');
  const streakEl = document.getElementById('streak');
  const levelEl = document.getElementById('level');
  const validateBtn = document.getElementById('validate');
  const pageTitleEl = document.getElementById('pageTitle');
  const modeAddBtn = document.getElementById('modeAdd');
  const modeSubBtn = document.getElementById('modeSub');
  const hintToggleBtn = document.getElementById('hintToggle');
  const cubesContainerEl = document.getElementById('cubesContainer');
  const mascotEl = document.getElementById('mascot');

  const praises = [
    "Bravo !", "Super !", "Génial !", "Excellent !", "Trop fort !",
    "Tu gères !", "Bien joué !", "Magnifique !", "Champion(ne) !", "Incroyable !"
  ];

  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  let mascotResetTimer = null;
  function setMascot(emoji, holdMs){
    mascotEl.textContent = emoji;
    mascotEl.classList.remove('bounce');
    void mascotEl.offsetWidth; // relance l'animation
    mascotEl.classList.add('bounce');
    if(mascotResetTimer) clearTimeout(mascotResetTimer);
    if(holdMs){
      mascotResetTimer = setTimeout(() => { mascotEl.textContent = '🦉'; }, holdMs);
    }
  }

  function newOperation(){
    if(mode === 'add'){
      if(level === 1){
        a = randInt(1, 9);
        b = randInt(1, 9);
      } else {
        a = randInt(1, 20);
        b = randInt(1, 20);
      }
      correctAnswer = a + b;
      opEl.innerHTML = `<span class="num-a">${a}</span><span class="op-symbol">+</span><span class="num-b">${b}</span>`;
    } else {
      if(level === 1){
        a = randInt(2, 9);
        b = randInt(1, a - 1);
      } else {
        a = randInt(2, 20);
        b = randInt(1, a - 1);
      }
      correctAnswer = a - b;
      opEl.innerHTML = `<span class="num-a">${a}</span><span class="op-symbol">−</span><span class="num-b">${b}</span>`;
    }
    answerEl.value = "";
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    renderCubes();
    answerEl.focus();
  }

  function renderCubes(){
    if(!showCubes){
      cubesContainerEl.classList.remove('visible');
      cubesContainerEl.innerHTML = '';
      return;
    }
    cubesContainerEl.classList.add('visible');
    let html = '';
    if(mode === 'add'){
      for(let i=0;i<a;i++) html += '<div class="cube a"></div>';
      html += '<div class="cubes-op-symbol">+</div>';
      for(let i=0;i<b;i++) html += '<div class="cube b"></div>';
    } else {
      for(let i=0;i<(a-b);i++) html += '<div class="cube a"></div>';
      for(let i=0;i<b;i++) html += '<div class="cube removed"></div>';
    }
    cubesContainerEl.innerHTML = html;
  }

  let audioCtx = null;
  function playSuccessSound(){
    try{
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === 'suspended'){
        audioCtx.resume();
      }
      const notes = [523.25, 659.25, 783.99, 1046.50]; // Do Mi Sol Do (arpège joyeux)
      const now = audioCtx.currentTime;
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.09;
        const end = start + 0.22;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.3, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, end);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(end + 0.05);
      });
    }catch(e){
      // audio non disponible, on ignore silencieusement
    }
  }

  function playVictorySound(){
    try{
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === 'suspended'){
        audioCtx.resume();
      }
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]; // montée plus longue
      const now = audioCtx.currentTime;
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const start = now + i * 0.11;
        const end = start + 0.3;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.35, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, end);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(end + 0.05);
      });
    }catch(e){}
  }

  const toastInlineEl = document.getElementById('toastInline');
  const toastEmojiEl = document.getElementById('toastEmoji');
  const toastTitleEl = document.getElementById('toastTitle');
  let toastHideTimer = null;

  function showToast(emoji, title){
    toastEmojiEl.textContent = emoji;
    toastTitleEl.textContent = title;
    toastInlineEl.classList.add('visible');
    if(toastHideTimer) clearTimeout(toastHideTimer);
    toastHideTimer = setTimeout(() => {
      toastInlineEl.classList.remove('visible');
    }, 2000);
  }

  function markBadgeEarned(streakLevel){
    const el = document.getElementById('badge' + streakLevel);
    const timeEl = document.getElementById('badge' + streakLevel + '-time');
    const elapsed = Date.now() - runStartTime;
    badgeTimes[streakLevel] = elapsed;
    if(el && !el.classList.contains('earned')){
      el.classList.add('earned');
    }
    if(timeEl){
      timeEl.textContent = formatTime(elapsed);
    }
  }

  const milestoneBadges = {
    5:  { emoji: "🥉", title: "Médaille de bronze !" },
    10: { emoji: "🥈", title: "Médaille d'argent !" },
    15: { emoji: "🥇", title: "Médaille d'or !" }
  };

  function showDiploma(finishedLevel, totalTime, times, onContinue){
    const overlay = document.createElement('div');
    overlay.className = 'diploma-overlay';

    const medalDefs = [
      { key: 5,  icon: "🥉", label: "5 d'affilée" },
      { key: 10, icon: "🥈", label: "10 d'affilée" },
      { key: 15, icon: "🥇", label: "15 d'affilée" }
    ];

    const medalsHtml = medalDefs.map(m => {
      const t = times[m.key];
      const missing = t === null ? ' missing' : '';
      const timeLabel = t === null ? '—' : formatTime(t);
      return `
        <div class="diploma-medal${missing}">
          <div class="diploma-medal-icon">${m.icon}</div>
          <div class="diploma-medal-time">${timeLabel}</div>
        </div>`;
    }).join('');

    overlay.innerHTML = `
      <div class="diploma-card">
        <div class="diploma-title">🎓 Diplôme</div>
        <div class="diploma-sub">Niveau ${finishedLevel} terminé !</div>
        <div class="diploma-medals">${medalsHtml}</div>
        <div class="diploma-total">Temps total : <b>${formatTime(totalTime)}</b></div>
        <button class="diploma-btn">Continuer</button>
      </div>`;

    document.body.appendChild(overlay);
    confettiBurst();
    overlay.querySelector('.diploma-btn').addEventListener('click', () => {
      overlay.remove();
      if(onContinue) onContinue();
    });
  }

  function handleLevelUp(){
    const finishedLevel = level;
    const totalTime = Date.now() - runStartTime;
    const times = { ...badgeTimes };

    playVictorySound();
    showDiploma(finishedLevel, totalTime, times, () => {
      level++;
      streak = 0;
      streakEl.textContent = streak;
      levelEl.textContent = level;
      runStartTime = Date.now();
      badgeTimes = { 5: null, 10: null, 15: null };
      ['5','10','15'].forEach(n => {
        document.getElementById('badge'+n).classList.remove('earned');
        document.getElementById('badge'+n+'-time').textContent = '';
      });
      newOperation();
    });
  }

  function confettiBurst(){
    const emojis = ["🎉","⭐","🌟","🎊","✨"];
    for(let i=0;i<14;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[randInt(0, emojis.length-1)];
      c.style.left = randInt(0,100) + 'vw';
      c.style.animationDuration = (1.2 + Math.random()*1.2) + 's';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 2600);
    }
  }

  function checkAnswer(){
    const val = parseInt(answerEl.value, 10);
    if(isNaN(val)){
      feedbackEl.textContent = "Écris un nombre 🙂";
      feedbackEl.className = "feedback bad";
      return;
    }
    if(val === correctAnswer){
      const prevA = a, prevB = b, prevAnswer = correctAnswer;
      good++;
      streak++;
      if(streak > best) best = streak;
      scoreGoodEl.textContent = good;
      streakEl.textContent = streak;
      playSuccessSound();
      confettiBurst();

      if(streak === 20){
        setMascot('🥳');
        handleLevelUp();
        return; // le diplôme gère lui-même la suite (bouton "Continuer")
      } else if(milestoneBadges[streak]){
        const badge = milestoneBadges[streak];
        markBadgeEarned(streak);
        showToast(badge.emoji, badge.title);
        setMascot('🤩', 1400);
      } else {
        const praise = praises[randInt(0, praises.length-1)];
        const opSymbol = mode === 'add' ? '+' : '−';
        showToast("✅", `${praise} ${prevA}${opSymbol}${prevB}=${prevAnswer}`);
        setMascot('😊', 1000);
      }

      // Nouvelle question tout de suite (avec le niveau à jour), sans attendre
      newOperation();
    } else {
      feedbackEl.textContent = "Presque ! Essaie encore 💪";
      feedbackEl.className = "feedback bad";
      setMascot('🤔', 1200);
      answerEl.select();
    }
  }

  function resetGame(){
    good = 0; streak = 0; best = 0; level = 1;
    runStartTime = Date.now();
    badgeTimes = { 5: null, 10: null, 15: null };
    scoreGoodEl.textContent = good;
    streakEl.textContent = streak;
    levelEl.textContent = level;
    toastInlineEl.classList.remove('visible');
    if(toastHideTimer) clearTimeout(toastHideTimer);
    ['5','10','15'].forEach(n => {
      document.getElementById('badge'+n).classList.remove('earned');
      document.getElementById('badge'+n+'-time').textContent = '';
    });
    newOperation();
  }

  function setMode(newMode){
    if(mode === newMode) return;
    mode = newMode;
    modeAddBtn.classList.toggle('active', mode === 'add');
    modeSubBtn.classList.toggle('active', mode === 'sub');
    pageTitleEl.textContent = mode === 'add' ? '🧮 Calcul Mental' : '➖ Calcul Mental';
    resetGame();
  }

  modeAddBtn.addEventListener('click', () => setMode('add'));
  modeSubBtn.addEventListener('click', () => setMode('sub'));

  hintToggleBtn.addEventListener('click', () => {
    showCubes = !showCubes;
    hintToggleBtn.classList.toggle('active', showCubes);
    hintToggleBtn.textContent = showCubes ? '✅ Je n\'ai plus besoin' : '🧊 Je compte avec les cubes';
    renderCubes();
  });

  validateBtn.addEventListener('click', checkAnswer);
  answerEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkAnswer();
  });

  newOperation();
</script>
</body>
</html>
